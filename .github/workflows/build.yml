name: Build Sideloadable Tweak

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Theos and SDKs
      run: |
        git clone --recursive https://github.com/theos/theos.git ~/theos
        git clone --depth 1 https://github.com/theos/sdks.git ~/theos/sdks

    - name: Build Raw Tweak File
      run: |
        export THEOS=~/theos
        # Run make to compile the raw binary files without making a deb package
        make FINALPACKAGE=1

    - name: Upload Raw Tweak File
      uses: actions/upload-artifact@v4
      with:
        name: TikTokMuteAudio-Sideload
        path: .theos/obj/debug/TikTokMuteAudio.dylib
