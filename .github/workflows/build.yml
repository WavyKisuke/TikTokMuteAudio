name: Build Sideloadable Tweak

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Theos and SDKs
      run: |
        bash -c "$(curl -fsSL https://githubusercontent.com)"
        git clone https://github.com ~/theos/sdks --depth 1

    - name: Build Raw Tweak File
      run: |
        export THEOS=~/theos
        # Run make to compile the raw binary files without making a deb package
        make FINALPACKAGE=1

    - name: Upload Raw Tweak File
      uses: actions/upload-artifact@v4
      with:
        name: TikTokMuteAudio-Sideload
        path: .theos/obj/debug/TikTokMuteAudio.dylib
