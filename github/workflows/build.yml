name: Build Tweak

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-13
    steps:
    - uses: actions/checkout@v3

    - name: Set up Theos
      run: |
        bash -c "$(curl -fsSL https://githubusercontent.com)"
        echo "THEOS=~/theos" >> $GITHUB_ENV

    - name: Setup iOS SDK
      run: |
        git clone https://github.com ~/theos/sdks --depth 1

    - name: Build Tweak
      run: |
        export THEOS=~/theos
        make package FINALPACKAGE=1

    - name: Upload Artifacts
      uses: actions/upload-artifact@v3
      with:
        name: TikTokMuteAudio-Dylib
        path: .theos/obj/debug/TikTokMuteAudio.dylib
